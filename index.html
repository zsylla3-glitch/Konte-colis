<title>Konté et Frère Colis</title>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Concept : outil de bureau d'agence. En-tête avec logo, onglets, cartes de colis lisibles, reçu sur fond papier. Bleu nuit + orange transport. */
:root{
  --bg:#F0F5F1; --panel:#FFFFFF; --ink:#0D4A38; --text:#17261F; --muted:#5A6B63; --line:#DCE5DF; --soft:#E7F0EA;
  --accent:#F2B705; --accent-ink:#2A1D00; --accent-text:#8A5F00; --on-ink:#FFFFFF;
  --hero1:#0B3F30; --hero2:#14674D;
  --ok:#14724A; --okbg:#DCF2E6; --bad:#A3321B; --badbg:#FCE4DD; --warn:#8A5A00; --warnbg:#FFF0CC;
  --paper:#FFFFFF; --paper-ink:#0D2B21; --paper-muted:#566860; --paper-line:#D6E0DA;
  --font-b:'Manrope',system-ui,sans-serif; --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09150F; --panel:#112119; --ink:#CBEBDC; --text:#E7F2EC; --muted:#9BB4A6; --line:#22382D; --soft:#183024;
  --accent:#F5C32C; --accent-ink:#2A1D00; --accent-text:#F5C32C; --on-ink:#09150F;
  --hero1:#0A3326; --hero2:#115C44;
  --ok:#6FD6A0; --okbg:#143A2B; --bad:#FF9D86; --badbg:#47211A; --warn:#F2C766; --warnbg:#3C2F0E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09150F; --panel:#112119; --ink:#CBEBDC; --text:#E7F2EC; --muted:#9BB4A6; --line:#22382D; --soft:#183024;
  --accent:#F5C32C; --accent-ink:#2A1D00; --accent-text:#F5C32C; --on-ink:#09150F;
  --hero1:#0A3326; --hero2:#115C44;
  --ok:#6FD6A0; --okbg:#143A2B; --bad:#FF9D86; --badbg:#47211A; --warn:#F2C766; --warnbg:#3C2F0E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.45;margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:56px;height:56px;border-radius:14px;background:var(--soft);border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:none;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand h1{font-size:22px;font-weight:800}
.brand .sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{background:none;border:1px solid var(--line);border-radius:12px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--on-ink);border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:13px;color:var(--muted)}
.tile.warn b{color:var(--bad)}
.bar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
.field,label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;min-height:46px;padding:0 12px;width:100%;color:var(--text)}
textarea{padding:10px 12px;min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
.list{display:flex;flex-direction:column;gap:12px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.pc .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mono{font-family:var(--font-m);font-weight:600;font-size:13px;background:var(--soft);padding:4px 8px;border-radius:8px;color:var(--ink)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-block;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.st{background:var(--soft);color:var(--ink)}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.route .who{display:flex;flex-direction:column;min-width:0}
.route .who b{overflow-wrap:anywhere}
.route .who span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.route .arrow{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--accent-text);gap:2px;text-align:center}
.route .arrow svg{width:28px;height:14px;stroke:var(--accent-text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nums{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.nums div{display:flex;flex-direction:column}
.nums small{font-size:12px;color:var(--muted)}
.nums b{font-size:17px;font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.track div{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.track div::before{content:"";height:5px;border-radius:99px;background:var(--line)}
.track div.on{color:var(--ink)}.track div.on::before{background:var(--ink)}
.track div.cur::before{background:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts select{width:auto;min-width:190px;min-height:40px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{flex-direction:row;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;cursor:pointer;color:var(--text);font-size:14px}
.seg input{width:18px;height:18px;min-height:0;accent-color:var(--ink)}
.seg label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.total{background:var(--soft);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.total b{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.banner{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}
.rates{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center}
.rates span{font-weight:600}
/* Reçu : fond papier identique dans les deux thèmes */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:28px;max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 30px rgba(10,16,40,.15)}
.paper .head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--paper-ink);padding-bottom:14px}
.paper .co{display:flex;gap:14px;align-items:center;min-width:0}
.paper .co .logo{background:#fff;border-color:var(--paper-line);color:var(--paper-muted);width:72px;height:72px}
.paper .co b{font-size:19px;font-weight:800;color:var(--paper-ink)}
.paper .co span{display:block;font-size:12.5px;color:var(--paper-muted)}
.paper .ttl{text-align:right}
.paper .ttl h2{font-size:20px;letter-spacing:.06em;color:var(--paper-ink)}
.paper .ttl .mono{background:#E7F0EA;color:var(--paper-ink);display:inline-block;margin-top:4px}
.paper .ttl span{display:block;font-size:12.5px;color:var(--paper-muted);margin-top:4px}
.paper .dest{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:800;font-size:18px;border:1.5px solid var(--paper-ink);border-radius:10px;padding:10px;flex-wrap:wrap;text-align:center}
.paper .dest svg{width:34px;height:14px;stroke:var(--paper-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.paper h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-muted);margin-bottom:6px}
.paper .party p{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.paper .party p.n{font-weight:800;font-size:16px}
.paper table{width:100%;border-collapse:collapse;font-size:14.5px}
.paper td,.paper th{padding:9px 6px;border-bottom:1px solid var(--paper-line);text-align:left;vertical-align:top}
.paper th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted)}
.paper td.r,.paper th.r{text-align:right;font-variant-numeric:tabular-nums}
.paper .pay{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.paper .stamp{border:3px solid;border-radius:10px;padding:6px 16px;font-weight:800;font-size:20px;letter-spacing:.08em;transform:rotate(-4deg)}
.paper .stamp.ok{color:#14724A;border-color:#14724A}.paper .stamp.bad{color:#A3321B;border-color:#A3321B}
.paper .amt{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--paper-ink)}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:10px}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:6px;font-size:12.5px;color:var(--paper-muted)}
.paper .foot{font-size:12px;color:var(--paper-muted);text-align:center}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:99px;font-weight:600;z-index:20}
@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar,.grid2,.grid3,.cols{grid-template-columns:minmax(0,1fr)}
  .route{grid-template-columns:minmax(0,1fr)}
  .route .arrow{flex-direction:row;justify-content:flex-start}
  .rates{grid-template-columns:minmax(0,1fr) 130px}
  .paper{padding:18px}.paper .ttl{text-align:left}
  .acts select{width:100%}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:active{transform:scale(.97)}}
.brand{flex-wrap:wrap}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:var(--okbg);padding:5px 10px;border-radius:99px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.late{color:var(--warn);background:var(--warnbg)}
.empty h2{font-size:18px;margin-bottom:6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.kv{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ph{display:flex;gap:8px;flex-wrap:wrap}
.ph .th{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--soft);flex:none;padding:0;cursor:zoom-in}
.ph .th img{width:100%;height:100%;object-fit:cover;display:block}
.ph .th.empty{display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:default;text-align:center}
.ph .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:99px;border:0;background:rgba(20,33,61,.85);color:#fff;font-weight:800;cursor:pointer;line-height:1;font-size:16px}
.add-ph{display:flex;gap:8px;flex-wrap:wrap}
.add-ph input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.pbig{position:fixed;inset:0;background:rgba(8,12,24,.92);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.pbig img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.paper .pics{display:flex;gap:10px;flex-wrap:wrap}
.paper .pics img{width:150px;height:150px;object-fit:cover;border:1px solid var(--paper-line);border-radius:6px}
.hint{color:var(--muted);font-size:13px}
/* Filigrane : le logo de l'entreprise en fond d'écran */
.wrap{position:relative;z-index:1}
/* Convois */
.cvpick{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.cvrow{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--text);background:var(--panel)}
.cvrow:has(input:checked){border-color:var(--ink);background:var(--soft)}
.cvrow input{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--ink);flex:none}
.cvrow.off{opacity:.55;cursor:not-allowed}
.cvmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.cvmain b{overflow-wrap:anywhere}
.cvmain small{color:var(--muted);font-size:13px}
.paper.wide{max-width:1000px}
.cvwrap{overflow-x:auto}
.cvt{min-width:700px}
.paper .cvt td small{display:block;color:var(--paper-muted);font-size:12px}
.cvt .mono{white-space:nowrap}
.cvt td:nth-child(1),.cvt td:nth-child(2),.cvt td:nth-child(5),.cvt td:nth-child(6),.cvt td:nth-child(7){white-space:nowrap}
.cvt td:first-child .pp{display:block;margin-top:5px}
.cvhint{display:none;text-align:center}
@media (max-width:760px){.cvhint{display:block}}
.paper .pp{font-weight:800;font-size:12.5px;white-space:nowrap}
.paper .pp.ok{color:#14724A}.paper .pp.bad{color:#A3321B}
.paper .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.paper .sum div{border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.paper .sum small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);font-weight:700}
.paper .sum b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--paper-ink)}
/* En-tête */
.brand{background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:22px;padding:14px 16px;box-shadow:0 8px 22px rgba(8,50,38,.22)}
.brand h1{color:#FFFFFF}
.brand .sub{color:#BFE3D2}
.brand .logo{border-radius:50%;border:2px solid #F2B705;background:#FFFFFF}
.brand .logo img{background:transparent}
.brand .sync{background:#F2B705;color:#2A1D00}
.brand .sync.late{background:#FFE9A6;color:#5C4000}
nav.tabs button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
.tile b{letter-spacing:-.01em}
/* Filigrane sur le reçu */
.paper{position:relative;overflow:hidden}
.paper::before{content:"";position:absolute;inset:0;background:var(--wm,none) center 55%/72% no-repeat;opacity:.1;pointer-events:none}
.paper>*{position:relative}
body::before{content:"";position:fixed;inset:0;background:var(--wm,none) center 40%/min(86vw,540px) no-repeat;opacity:.13;pointer-events:none;z-index:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.18}}
:root[data-theme="dark"] body::before{opacity:.18}
.tile,.pc,.card{background:var(--panel);background:color-mix(in srgb,var(--panel) 84%,transparent)}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* =====================================================================
   Connexion + base de données (Supabase) pour Konté et Frère Colis
   Ce bloc remplace la base intégrée à Claude : il fournit la même interface
   (collection / doc / onSnapshot / set / update / delete / acquire), mais les
   données vivent dans VOTRE projet Supabase, derrière une connexion e-mail +
   mot de passe et des règles d'accès (RLS) qui n'ouvrent la base qu'aux membres.
   ===================================================================== */
(function(){
'use strict';
var cfg=window.APP_CONFIG||{},sb=null,uid='',email='',myName='',entered=false,names=null;
var colls={},started=false,fails=0;
var CACHED={photos:1};   /* les photos sont gardées sur l'appareil pour ne pas être retéléchargées */

function rid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function mapErr(e){
  var c=e&&(e.code||e.status),m=String(e&&e.message||'');
  if(/Failed to fetch|NetworkError|network|Load failed/i.test(m))return {code:'unavailable'};
  if(c==='42501'||c==='PGRST301'||c===401||c===403)return {code:'permission_denied'};
  if(c==='P0002'||c==='PGRST116')return {code:'not_found'};
  if(c===413||/payload|too large/i.test(m))return {code:'quota_exceeded'};
  return {code:'internal'};
}
function ck(r){if(r&&r.error)throw mapErr(r.error);return r}
function freezeData(d){return Object.freeze(Object.assign({},d||{}))}

/* ---------- Cache local (IndexedDB), photos seulement ---------- */
var idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res){try{var r=indexedDB.open('konte-cache',1);r.onupgradeneeded=function(){r.result.createObjectStore('rows',{keyPath:'k'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}});
  return idbP;
}
async function idbAll(c){var db=await idb();if(!db)return [];return new Promise(function(res){try{var q=db.transaction('rows').objectStore('rows').getAll(IDBKeyRange.bound(c+'/',c+'/￿'));q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
async function idbPut(c,id,data,u){var db=await idb();if(!db)return;try{db.transaction('rows','readwrite').objectStore('rows').put({k:c+'/'+id,c:c,id:id,data:data,u:u})}catch(e){}}
async function idbDel(c,id){var db=await idb();if(!db)return;try{db.transaction('rows','readwrite').objectStore('rows').delete(c+'/'+id)}catch(e){}}
function idbWipe(){return new Promise(function(res){try{var done=function(){res()};if(idbP)idbP.then(function(d){if(d)d.close()});var r=indexedDB.deleteDatabase('konte-cache');r.onsuccess=done;r.onerror=done;r.onblocked=done;setTimeout(done,1500)}catch(e){res()}})}

/* ---------- Collections en mémoire, synchronisées avec Supabase ---------- */
function K(c){if(!colls[c])colls[c]={map:new Map(),subs:[],dsubs:[],errs:[],loaded:false,started:false,last:0};return colls[c]}
function snapOf(k){var docs=[];k.map.forEach(function(v,id){docs.push({id:id,data:function(){return v.data}})});return {docs:docs,metadata:{fromCache:false}}}
function dsnap(k,id){var v=k.map.get(id);return {exists:!!v,data:function(){return v?v.data:undefined}}}
function emit(c){
  var k=colls[c];if(!k)return;var sn=snapOf(k);
  k.subs.forEach(function(f){try{f(sn)}catch(e){console.error(e)}});
  k.dsubs.forEach(function(s){try{s.cb(dsnap(k,s.id))}catch(e){console.error(e)}});
}
async function sync(c){
  var k=K(c),size=CACHED[c]?5:100;
  var r=ck(await sb.from('docs').select('id,updated_at').eq('collection',c));
  var srv=new Map(),need=[],changed=false;
  (r.data||[]).forEach(function(x){srv.set(x.id,x.updated_at)});
  srv.forEach(function(u,id){var v=k.map.get(id);if(!v||v.u!==u)need.push(id)});
  if(Date.now()-k.last>3000){k.map.forEach(function(v,id){if(!srv.has(id)){k.map.delete(id);changed=true;if(CACHED[c])idbDel(c,id)}})}
  for(var i=0;i<need.length;i+=size){
    var rr=ck(await sb.from('docs').select('id,data,updated_at').eq('collection',c).in('id',need.slice(i,i+size)));
    (rr.data||[]).forEach(function(x){k.map.set(x.id,{data:freezeData(x.data),u:x.updated_at});changed=true;if(CACHED[c])idbPut(c,x.id,x.data,x.updated_at)});
  }
  if(changed||!k.loaded){k.loaded=true;emit(c)}
}
function syncAll(){Object.keys(colls).forEach(function(c){sync(c).catch(function(){})})}
function onChange(p){
  var row=(p.new&&p.new.collection)?p.new:p.old;if(!row||!colls[row.collection])return;
  var c=row.collection,k=colls[c];
  if(p.eventType==='DELETE'){k.map.delete(row.id);if(CACHED[c])idbDel(c,row.id);emit(c);return}
  if(!p.new||p.new.data===undefined){sync(c).catch(function(){});return}
  k.map.set(row.id,{data:freezeData(p.new.data),u:p.new.updated_at});
  if(CACHED[c])idbPut(c,row.id,p.new.data,p.new.updated_at);
  emit(c);
}
function background(){
  if(started)return;started=true;
  try{sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},onChange).subscribe()}catch(e){}
  setInterval(syncAll,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)syncAll()});
  window.addEventListener('online',syncAll);
}
function watch(c){
  var k=K(c);if(k.started)return;k.started=true;background();
  (async function(){
    if(CACHED[c]){var rows=await idbAll(c);rows.forEach(function(x){k.map.set(x.id,{data:freezeData(x.data),u:x.u})});if(rows.length)emit(c)}
    try{await sync(c)}catch(e){k.errs.forEach(function(f){try{f(e)}catch(x){}})}
  })();
}

/* ---------- Écritures ---------- */
async function setDoc(c,id,d){
  var k=K(c);k.last=Date.now();
  var r=ck(await sb.from('docs').upsert({collection:c,id:id,data:d}).select('updated_at').single());
  k.map.set(id,{data:freezeData(d),u:r.data.updated_at});k.last=Date.now();
  if(CACHED[c])idbPut(c,id,d,r.data.updated_at);emit(c);
}
async function patchDoc(c,id,patch){
  var k=K(c);k.last=Date.now();
  var r=ck(await sb.rpc('merge_doc',{p_collection:c,p_id:id,p_patch:patch})),cur=k.map.get(id);
  if(cur){var nd=Object.assign({},cur.data,patch);k.map.set(id,{data:freezeData(nd),u:r.data});if(CACHED[c])idbPut(c,id,nd,r.data);emit(c)}
  else await sync(c);
  k.last=Date.now();
}
async function delDoc(c,id){
  var k=K(c);k.last=Date.now();
  ck(await sb.from('docs').delete().eq('collection',c).eq('id',id));
  k.map.delete(id);if(CACHED[c])idbDel(c,id);emit(c);
}
async function getDoc(c,id){
  var r=ck(await sb.from('docs').select('data').eq('collection',c).eq('id',id).maybeSingle());
  return {exists:!!r.data,data:function(){return r.data?r.data.data:undefined}};
}
async function acquire(name){
  var r=ck(await sb.rpc('try_lock',{p_name:name,p_holder:rid(),p_ttl_ms:3000}));
  return {acquired:r.data===true};
}
var db={
  collection:function(c){return {onSnapshot:function(cb,eb){var k=K(c);k.subs.push(cb);k.errs.push(eb||function(){});if(k.loaded)cb(snapOf(k));watch(c)}}},
  doc:function(path){
    var i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);
    return {
      onSnapshot:function(cb,eb){var k=K(c);k.dsubs.push({id:id,cb:cb});k.errs.push(eb||function(){});if(k.loaded)cb(dsnap(k,id));watch(c)},
      get:function(){return getDoc(c,id)},
      set:function(d){return setDoc(c,id,d)},
      update:function(d){return patchDoc(c,id,d)},
      delete:function(){return delDoc(c,id)},
      acquire:function(){return acquire(path)}
    };
  }
};

async function loadNames(){
  if(names)return names;names={};
  try{var r=await sb.rpc('member_names');(r.data||[]).forEach(function(x){names[x.id]=x.name||''})}catch(e){}
  return names;
}
var user={
  can:async function(){return true},
  id:async function(){return uid},
  isOwner:async function(){return false},
  canEdit:async function(){return true},
  me:async function(){return {name:myName||email}},
  profiles:async function(ids){var n=await loadNames(),o={};(ids||[]).forEach(function(i){if(n[i]!==undefined)o[i]={name:n[i],isMe:i===uid}});return o}
};
function saveBlob(name,blob){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},30000);
}
var dl={save:async function(o){
  var d=o.data,blob=(d instanceof Blob)?d:new Blob([d],{type:/\.pdf$/i.test(o.filename)?'application/pdf':'application/octet-stream'});
  saveBlob(o.filename,blob);
}};
async function backup(){
  var out={app:'konte-colis',date:new Date().toISOString(),docs:[]},from=0,size=20;
  for(;;){
    var r=ck(await sb.from('docs').select('collection,id,data').order('collection').order('id').range(from,from+size-1)),rows=r.data||[];
    out.docs=out.docs.concat(rows);if(rows.length<size)break;from+=size;
  }
  saveBlob('sauvegarde-colis-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(out)],{type:'application/json'}));
  toast('Sauvegarde téléchargée ('+out.docs.length+' éléments)');
}
async function logout(){try{await sb.auth.signOut()}catch(e){}await idbWipe();location.reload()}

/* ---------- Écran de connexion ---------- */
var CSS='#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--hero1),var(--hero2));overflow:auto}'+
'#gate[hidden]{display:none}#gate form{background:var(--panel);color:var(--text);border-radius:24px;padding:26px 22px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}'+
'#gate img{width:96px;height:96px;align-self:center;border-radius:50%}#gate h1{font-size:22px;text-align:center;margin:4px 0 0}#gate .gsub{margin:0 0 8px;text-align:center;color:var(--muted)}'+
'#gate label{font-weight:600;font-size:13px;color:var(--muted)}#gate .btn{margin-top:8px}#g-msg,#r-msg{min-height:20px;margin:0;color:var(--bad);font-weight:600;font-size:14px}#g-msg.ok,#r-msg.ok{color:var(--ok)}'+
'#gate .linkbtn{background:none;border:0;padding:8px 4px;color:var(--ink);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer;align-self:center;min-height:40px}#gate .linkbtn:disabled{opacity:.5;cursor:default}#gate form[hidden]{display:none}';
function ensureGate(){
  if(document.getElementById('gate'))return document.getElementById('gate');
  var st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st);
  var g=document.createElement('div');g.id='gate';
  g.innerHTML='<form id="gate-form" autocomplete="on"><img id="gate-logo" alt="Logo Konté et Frère Colis"><h1>Konté et Frère Colis</h1><p class="gsub">Accès réservé aux associés</p>'+
  '<label for="g-email">Adresse e-mail</label><input id="g-email" type="email" autocomplete="username" inputmode="email" required>'+
  '<label for="g-pass">Mot de passe</label><input id="g-pass" type="password" autocomplete="current-password" required>'+
  '<button id="g-btn" class="btn accent" type="submit">Se connecter</button><button id="g-forgot" class="linkbtn" type="button">Mot de passe oublié ?</button><p id="g-msg" role="alert"></p></form>'+
  '<form id="rec-form" autocomplete="off" hidden><img id="rec-logo" alt="Logo Konté et Frère Colis"><h1>Nouveau mot de passe</h1><p class="gsub">Choisis un mot de passe long (8 caractères ou plus).</p>'+
  '<label for="r-pass">Nouveau mot de passe</label><input id="r-pass" type="password" autocomplete="new-password" minlength="8" required>'+
  '<label for="r-pass2">Retape le mot de passe</label><input id="r-pass2" type="password" autocomplete="new-password" minlength="8" required>'+
  '<button id="r-btn" class="btn accent" type="submit">Enregistrer</button><p id="r-msg" role="alert"></p></form>';
  document.body.appendChild(g);
  try{document.getElementById('gate-logo').src=LOGO;document.getElementById('rec-logo').src=LOGO}catch(e){}
  document.getElementById('gate-form').addEventListener('submit',onLogin);
  document.getElementById('g-forgot').addEventListener('click',onForgot);
  document.getElementById('rec-form').addEventListener('submit',onRecover);
  return g;
}
function showGate(msg,hideForm){
  var g=ensureGate();g.hidden=false;document.getElementById('g-msg').className='';document.getElementById('g-msg').textContent=msg||'';
  if(hideForm){var f=document.getElementById('gate-form');[].forEach.call(f.querySelectorAll('label,input,button'),function(x){x.hidden=true})}
}
async function onLogin(e){
  e.preventDefault();
  var b=document.getElementById('g-btn'),m=document.getElementById('g-msg');
  b.disabled=true;m.textContent='';
  if(fails>=3)await new Promise(function(r){setTimeout(r,Math.min(8000,fails*1500))});
  var r=await sb.auth.signInWithPassword({email:document.getElementById('g-email').value.trim(),password:document.getElementById('g-pass').value});
  if(r.error||!r.data||!r.data.session){fails++;m.textContent=/rate|too many/i.test(String(r.error&&r.error.message))?'Trop d\'essais. Attends une minute puis réessaie.':'Adresse e-mail ou mot de passe incorrect.';b.disabled=false;return}
  document.getElementById('g-pass').value='';fails=0;b.disabled=false;
  await enter(r.data.session);
}
var recovering=false;
async function onForgot(){
  var m=document.getElementById('g-msg'),b=document.getElementById('g-forgot'),em=document.getElementById('g-email').value.trim();
  m.className='';
  if(!em){m.textContent='Écris d\'abord ton adresse e-mail dans la case ci-dessus.';return}
  b.disabled=true;
  var r=null;
  try{r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname})}catch(e){}
  if(r&&r.error&&/rate|too many|seconds/i.test(String(r.error.message))){m.textContent='Trop de demandes. Attends quelques minutes puis réessaie.';setTimeout(function(){b.disabled=false},30000);return}
  m.className='ok';m.textContent='Si cette adresse est enregistrée, un e-mail avec un lien vient d\'être envoyé. Regarde aussi dans les courriers indésirables (spams).';
  setTimeout(function(){b.disabled=false},30000);
}
function showRecovery(){
  var g=ensureGate();g.hidden=false;
  document.getElementById('gate-form').hidden=true;document.getElementById('rec-form').hidden=false;
}
async function onRecover(e){
  e.preventDefault();
  var a=document.getElementById('r-pass').value,c=document.getElementById('r-pass2').value,m=document.getElementById('r-msg'),b=document.getElementById('r-btn');
  m.className='';
  if(a.length<8){m.textContent='Le mot de passe doit avoir au moins 8 caractères.';return}
  if(a!==c){m.textContent='Les deux mots de passe ne sont pas identiques.';return}
  b.disabled=true;
  var r=await sb.auth.updateUser({password:a});
  b.disabled=false;
  if(r&&r.error){m.textContent=/same|different/i.test(String(r.error.message))?'Choisis un mot de passe différent de l\'ancien.':'Impossible de changer le mot de passe. Le lien a peut-être expiré : reviens à la connexion et refais « Mot de passe oublié ? ».';return}
  document.getElementById('r-pass').value='';document.getElementById('r-pass2').value='';
  recovering=false;
  try{history.replaceState(null,'',location.pathname)}catch(x){}
  var s=await sb.auth.getSession();
  if(s&&s.data&&s.data.session){document.getElementById('rec-form').hidden=true;document.getElementById('gate-form').hidden=false;await enter(s.data.session)}
  else{document.getElementById('rec-form').hidden=true;document.getElementById('gate-form').hidden=false;showGate('Mot de passe changé. Connecte-toi avec le nouveau.')}
}
function hideGate(){var g=document.getElementById('gate');if(g)g.hidden=true}

  if(el.dataset.logout){logout();return}

});

/* ---------- Démarrage ---------- */
async function enter(session){
  uid=session.user.id;email=session.user.email||'';
  var m=await sb.rpc('is_member');
  if(m.error||m.data!==true){try{await sb.auth.signOut()}catch(e){}showGate('Ce compte n\'est pas autorisé. Contacte le propriétaire.');return}
  entered=true;hideGate();
  window.claude={use:async function(n){return n==='db'?db:n==='user'?user:n==='downloads'?dl:null}};
  myName=(await loadNames())[uid]||'';
  init();
}
async function start(){
  patchViews();
  var ok=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(cfg.SUPABASE_URL||'')&&String(cfg.SUPABASE_ANON_KEY||'').length>30;
  if(!ok||!window.supabase){showGate('Le site n\'est pas encore configuré (fichier config.js).',true);return}
  var hh=location.hash||'';recovering=/type=recovery/.test(hh);
  var linkErr=/error_code=|error=access_denied|error_description=/.test(hh);
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'konte-auth'}});
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&entered){location.reload()}});
  var s=await sb.auth.getSession();
  if(linkErr){try{history.replaceState(null,'',location.pathname)}catch(x){}
    if(!(s&&s.data&&s.data.session)||!recovering){showGate('Ce lien a expiré ou a déjà été utilisé. Demande un nouveau lien avec « Mot de passe oublié ? ».');return}}
  if(recovering&&s&&s.data&&s.data.session){showRecovery();return}
  if(s&&s.data&&s.data.session)await enter(s.data.session);else showGate('');
}
window.Standalone={start:start};
})();

var MAXPH=3,PH_LIMIT=190000;
function photosOf(no){return (S.photos[no]||[]).slice().sort(function(a,b){return a.n-b.n})}

function shrink(file){return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=function(){rej()};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej()};
    im.onload=function(){
      var out='',steps=[[900,.72],[760,.64],[640,.56],[520,.5],[420,.45]];
      for(var i=0;i<steps.length&&!out;i++){var m=steps[i][0],sc=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
        var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
        var u=cv.toDataURL('image/jpeg',steps[i][1]);if(u.length<=PH_LIMIT)out=u}
      out?res(out):rej()};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

function filtered(){var f=S.f,q=f.q.trim().toLowerCase();
  return S.parcels.filter(function(p){
    if(f.st!==''&&String(p.st)!==f.st)return false;
    if(f.pay==='paid'&&!p.paid)return false;
    if(f.pay==='unpaid'&&p.paid)return false;
    if(f.co&&p.country!==f.co)return false;
    if(q){var h=(p.no+' '+p.s.fn+' '+p.s.ln+' '+p.r.fn+' '+p.r.ln+' '+p.s.ph+' '+p.r.ph+' '+p.country+' '+p.r.city).toLowerCase();if(h.indexOf(q)<0)return false}
    return true}).slice().reverse();
}

/* ---------- Reçu en PDF ---------- */
function pdfStr(s){return String(s==null?'':s).replace(/[  ]/g,' ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E\xA0-\xFF]/g,'')}
function loadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res({src:src,w:im.width,h:im.height})};im.onerror=function(){res(null)};im.src=src})}
async function makePdf(id){
  var p=byId(id);if(!p)return;
  if(!S.dl){toast('Téléchargement indisponible dans cette vue');return}
  var J=window.jspdf;if(!J){toast('Le module PDF ne s\'est pas chargé');return}

function resolveNames(){
  if(!S.user)return;
  var need=[];S.parcels.forEach(function(p){if(p.by&&!(p.by in S.names)&&need.indexOf(p.by)<0)need.push(p.by)});
  if(!need.length)return;
  need.forEach(function(i){S.names[i]=''});
  S.user.profiles(need).then(function(m){need.forEach(function(i){var pr=m&&m[i];S.names[i]=pr?(pr.isMe?'toi':(pr.name||'')):''});if(S.view==='list')refreshList()},function(){});
}
function startDb(){
  var db=S.db;
  S.t=setTimeout(function(){if(!S.confirmed){S.late=true;brand();refreshList()}},10000);
  db.collection('parcels').onSnapshot(function(sn){
    var a=[];sn.docs.forEach(function(d){var x=Object.assign({},d.data()||{});x.id=d.id;a.push(x)});
    a.sort(function(x,y){return numOf(x.no)-numOf(y.no)});
    if(sn.metadata.fromCache&&S.confirmed&&a.length<S.parcels.length)return;
    S.parcels=a;S.loaded=true;
    if(!sn.metadata.fromCache){S.confirmed=true;S.late=false;clearTimeout(S.t);brand()}
    resolveNames();
    if(S.view==='list')refreshList();else if(S.view==='receipt'||S.view==='convoy'||S.view==='convoys')rerender();else if(S.view==='cvform')refreshCvPicker();
  },function(){clearTimeout(S.t);S.late=true;brand();refreshList()});
  db.collection('convoys').onSnapshot(function(sn){
    var a=[];sn.docs.forEach(function(d){var x=Object.assign({},d.data()||{});x.id=d.id;a.push(x)});
    a.sort(function(x,y){return numOf(x.no)-numOf(y.no)});
    if(sn.metadata.fromCache&&S.cvConf&&a.length<S.convoys.length)return;
    if(!sn.metadata.fromCache)S.cvConf=true;
    S.convoys=a;S.cvLoaded=true;
    if(S.view==='convoys'||S.view==='convoy')rerender();
  },function(){S.cvLoaded=true;if(S.view==='convoys')rerender()});
  db.collection('photos').onSnapshot(function(sn){
    var m={};sn.docs.forEach(function(d){var x=d.data()||{};if(!x.no)return;(m[x.no]=m[x.no]||[]).push({n:x.n||1,d:x.d||''})});
    S.photos=m;
    if(S.view==='list'&&!typing())refreshList();else if(S.view==='receipt')rerender();
  },function(){});
  db.doc('config/company').onSnapshot(function(sn){
    S.cDoc=sn.exists?sn.data():null;
    if(!typing())syncCompany();
    brand();if(S.view==='receipt')rerender();
  },function(){});
  db.doc('config/logo').onSnapshot(function(sn){
    S.lDoc=sn.exists?sn.data():null;
    if(!typing())syncCompany();
    brand();if(S.view==='receipt'||S.view==='settings')rerender();
  },function(){});
  db.doc('config/rates').onSnapshot(function(sn){
    S.rDoc=sn.exists?sn.data():null;
    if(!typing()){S.rates=Object.assign({},RATES0,(S.rDoc&&S.rDoc.rates)||{});if(S.view==='rates')rerender()}
  },function(){});
}
async function nextNo(){
  var ref=S.db.doc('config/counter');
  for(var tries=0;tries<10;tries++){
    var r=await ref.acquire({holder:S.uid||'anon',ttlMs:3000});
    if(r.acquired){
      var snap=await ref.get(),cur=snap.exists?(snap.data().seq||0):0;
      var top=S.parcels.reduce(function(m,p){return Math.max(m,numOf(p.no))},0);
      var n=Math.max(cur,top)+1;
      await ref.set({seq:n});
      return 'COL-'+String(n).padStart(4,'0');
    }
    await sleep(500);
  }
  throw {code:'unavailable'};
}

function readLegacy(){
  try{
    if(localStorage.getItem(DONE))return null;
    var raw=localStorage.getItem(KEY);if(!raw)return null;
    var d=JSON.parse(raw);if(!d||!Array.isArray(d.parcels))return null;
    var P=d.parcels.filter(function(p){return p&&!p.ex&&p.s&&p.r});
    var co=d.company||{};
    var hasCo=!!((co.name&&co.name!==CO0.name)||(co.phone&&co.phone!==CO0.phone)||(co.address&&co.address!==CO0.address)||(co.logo&&co.logo!==LOGO));
    var hasRates=!!(d.rates&&JSON.stringify(d.rates)!==JSON.stringify(RATES0));
    if(!P.length&&!hasCo&&!hasRates)return null;
    return {parcels:P,company:hasCo?co:null,rates:hasRates?d.rates:null,seq:d.seq||1};
  }catch(e){return null}
}
async function importLegacy(){
  var G=S.legacy,db=S.db;if(!G||S.busy)return;
  S.busy=true;refreshList();
  try{
    var max=0;
    for(var i=0;i<G.parcels.length;i++){
      var p=G.parcels[i],no=p.no||('COL-'+String(i+1).padStart(4,'0'));max=Math.max(max,numOf(no));
      await db.doc('parcels/'+no).set({no:no,date:p.date||'',s:p.s,r:p.r,country:p.country||'',desc:p.desc||'',w:+p.w||0,rate:+p.rate||0,paid:!!p.paid,st:+p.st||0,by:S.uid,at:Date.now(),imp:true});
    }
    if(G.rates&&!S.rDoc)await db.doc('config/rates').set({rates:Object.assign({},RATES0,G.rates)});
    if(G.company){
      var co=G.company;
      if(!S.cDoc)await db.doc('config/company').set({name:co.name||CO0.name,phone:co.phone||'',address:co.address||''});
      if(co.logo&&co.logo!==LOGO&&co.logo.length<=230000&&!S.lDoc)await db.doc('config/logo').set({data:co.logo});
    }
    var top=Math.max(max,(G.seq||1)-1);
    if(top){var ref=db.doc('config/counter'),sn=await ref.get(),cur=sn.exists?(sn.data().seq||0):0;await ref.set({seq:Math.max(cur,top)})}
    try{localStorage.setItem(DONE,'1')}catch(x){}
    S.legacy=null;toast('Données importées');
  }catch(e){dbErr(e)}
  S.busy=false;refreshList();
}

  var w=null;

  try{if(S.user){S.uid=(await S.user.id())||'';S.owner=await S.user.isOwner();S.admin=await S.user.canEdit();S.me=await S.user.me()}}catch(e){}

  try{startDb()}catch(e){S.late=true}
  render();
}

async function savePhotos(no){

  // photos déjà enregistrées gardées
  S.draft.filter(function(x){return !x.isNew}).forEach(function(x){keep.push(x.n)});
  // supprimer celles retirées
  for(var i=0;i<old.length;i++){if(keep.indexOf(old[i].n)<0){await db.doc('photos/'+phId(no,old[i].n)).delete()}}
  // ajouter les nouvelles avec un numéro libre

}

function cvById(id){return S.convoys.filter(function(c){return c.id===id})[0]||(S.cvLocal&&S.cvLocal.id===id?S.cvLocal:null)}
function cvParcels(c){return (c.parcels||[]).map(byNo).filter(Boolean)}
function cvStats(c){var L=cvParcels(c),w=0,t=0,paid=0;L.forEach(function(p){w+=p.w;var x=total(p);t+=x;if(p.paid)paid+=x});return {n:L.length,missing:(c.parcels||[]).length-L.length,w:w,t:t,paid:paid,due:t-paid}}
function cvOf(no,exceptId){return S.convoys.filter(function(c){return c.id!==exceptId&&(c.parcels||[]).indexOf(no)>=0})[0]}
async function nextCvNo(){
  var ref=S.db.doc('config/convoyCounter');
  for(var tries=0;tries<10;tries++){
    var r=await ref.acquire({holder:S.uid||'anon',ttlMs:3000});
    if(r.acquired){
      var snap=await ref.get(),cur=snap.exists?(snap.data().seq||0):0;
      var top=S.convoys.reduce(function(m,c){return Math.max(m,numOf(c.no))},0);
      var n=Math.max(cur,top)+1;
      await ref.set({seq:n});
      return 'CNV-'+String(n).padStart(4,'0');
    }
    await sleep(500);
  }
  throw {code:'unavailable'};
}

function cvCard(c){
  var st=cvStats(c),sure=S.cvConfirm===c.id;
  return '<article class="pc"><div class="r1"><span class="mono">'+esc(c.no)+'</span><b>'+esc(c.name)+'</b><span style="flex:1"></span><span style="color:var(--muted);font-size:13px">'+esc(fdate(c.date))+'</span></div>'+
  '<div class="nums"><div><small>Colis</small><b>'+st.n+'</b></div><div><small>Poids</small><b>'+kg(st.w)+'</b></div><div><small>Frais total</small><b>'+fcfa(st.t)+'</b></div><div><small>Reste à payer</small><b style="color:'+(st.due>0?'var(--bad)':'var(--ok)')+'">'+fcfa(st.due)+'</b></div></div>'+
  '<div class="acts"><button class="btn sm" data-cvopen="'+esc(c.id)+'">Voir</button>'+(S.dlOk!==false?'<button class="btn accent sm" data-cvpdf="'+esc(c.id)+'">PDF</button>':'')+
  '<button class="btn ghost sm" data-cvedit="'+esc(c.id)+'">Modifier</button>'+
  (sure?'<button class="btn danger sm" data-cvdelc="'+esc(c.id)+'">Confirmer la suppression</button>':'<button class="btn ghost sm" data-cvdel="'+esc(c.id)+'">Supprimer</button>')+'</div></article>';
}

V.convoys=function(){
  if(!S.cvLoaded)return '<div class="empty">Chargement des convois…</div>';
  var top='<div class="acts" style="justify-content:space-between"><h2 style="font-size:22px">Convois</h2><button class="btn accent" data-cvnew="1">Nouveau convoi</button></div>';
  if(!S.convoys.length)return top+'<div class="empty"><h2>Aucun convoi</h2><p style="margin:0 0 14px">Un convoi regroupe les colis qui partent ensemble. Choisis les colis, puis télécharge la liste en PDF.</p><button class="btn accent" data-cvnew="1">Créer le premier convoi</button></div>';
  var L=S.convoys.slice().sort(function(a,b){return (a.date<b.date?1:a.date>b.date?-1:0)||(numOf(b.no)-numOf(a.no))});
  return top+'<div class="list">'+L.map(cvCard).join('')+'</div>';
};

V.convoy=function(){
  var c=cvById(S.cv);
  if(!c)return '<div class="empty"><h2>Ce convoi n\'existe plus</h2><button class="btn" data-nav="convoys">Retour aux convois</button></div>';
  var L=cvParcels(c),st=cvStats(c),co=S.company;
  var rows=L.map(function(p){
    return '<tr><td><span class="mono">'+esc(p.no)+'</span><span class="pp '+(p.paid?'ok':'bad')+'">'+(p.paid?'Payé':'Non payé')+'</span></td><td>'+esc(p.date)+'</td>'+
    '<td><b>'+esc(p.s.fn)+' '+esc(p.s.ln)+'</b><small>'+esc(p.s.ph)+'</small></td>'+
    '<td><b>'+esc(p.r.fn)+' '+esc(p.r.ln)+'</b><small>'+esc(p.r.ph)+'</small></td>'+
    '<td class="r">'+kg(p.w)+'</td><td class="r">'+fcfa(p.rate)+'</td><td class="r"><b>'+fcfa(total(p))+'</b></td></tr>'}).join('');
  return '<div class="acts"><button class="btn ghost" data-nav="convoys">Retour aux convois</button>'+(S.dlOk!==false?'<button class="btn accent" data-cvpdf="'+esc(c.id)+'">Télécharger le PDF</button>':'')+'<button class="btn ghost" data-cvedit="'+esc(c.id)+'">Modifier</button></div>'+
  '<article class="paper wide" aria-label="Convoi '+esc(c.no)+'"><div class="head"><div class="co"><div class="logo">'+(co.logo?'<img src="'+esc(co.logo)+'" alt="Logo">':'Votre<br>logo')+'</div><div><b>'+esc(co.name)+'</b>'+(co.address?'<span>'+esc(co.address)+'</span>':'')+(co.phone?'<span>Tél. '+esc(co.phone)+'</span>':'')+'</div></div>'+
  '<div class="ttl"><h2>CONVOI DE COLIS</h2><span class="mono">'+esc(c.no)+'</span><span>'+esc(c.name)+'</span><span>Date : '+esc(fdate(c.date))+'</span></div></div>'+
  (L.length?'<div class="cvwrap"><table class="cvt"><thead><tr><th>N° colis / paiement</th><th>Date</th><th>Expéditeur</th><th>Bénéficiaire</th><th class="r">Poids</th><th class="r">Prix / kg</th><th class="r">Frais total</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="hint cvhint">Fais glisser le tableau vers la gauche pour voir toutes les colonnes.</div>':'<div class="foot">Aucun colis dans ce convoi.</div>')+
  (st.missing>0?'<div class="foot">'+st.missing+' colis de ce convoi ont été supprimés et n\'apparaissent plus.</div>':'')+
  '<div class="sum"><div><small>Colis</small><b>'+st.n+'</b></div><div><small>Poids total</small><b>'+kg(st.w)+'</b></div><div><small>Frais total</small><b>'+fcfa(st.t)+'</b></div><div><small>Déjà payé</small><b>'+fcfa(st.paid)+'</b></div><div><small>Reste à payer</small><b style="color:'+(st.due>0?'#A3321B':'#14724A')+'">'+fcfa(st.due)+'</b></div></div>'+
  '<div class="foot"><b style="color:var(--paper-ink)">'+esc(co.name)+'</b>'+(co.address?' · '+esc(co.address):'')+(co.phone?' · Tél. '+esc(co.phone):'')+'</div></article>';
};

function cvVisible(){
  var q=(S.cvQ||'').trim().toLowerCase();
  return S.parcels.slice().reverse().filter(function(p){
    if(!q)return true;
    var h=(p.no+' '+p.s.fn+' '+p.s.ln+' '+p.r.fn+' '+p.r.ln+' '+p.s.ph+' '+p.r.ph+' '+p.date).toLowerCase();
    return h.indexOf(q)>=0});
}
function cvPickHtml(){
  if(!S.parcels.length)return '<div class="empty">Aucun colis enregistré. Enregistre d\'abord des colis, puis reviens créer le convoi.</div>';
  var L=cvVisible();
  if(!L.length)return '<div class="empty">Aucun colis ne correspond à cette recherche.</div>';
  return L.map(function(p){
    var other=cvOf(p.no,S.cvEdit),on=S.cvSel.indexOf(p.no)>=0;
    return '<label class="cvrow'+(other?' off':'')+'" for="cvp-'+esc(p.no)+'"><input type="checkbox" id="cvp-'+esc(p.no)+'" data-cvp="'+esc(p.no)+'"'+(on?' checked':'')+(other?' disabled':'')+'>'+
    '<span class="cvmain"><b>'+esc(p.no)+' · '+esc(p.s.fn)+' '+esc(p.s.ln)+' → '+esc(p.r.fn)+' '+esc(p.r.ln)+'</b><small>'+esc(p.date)+' · '+kg(p.w)+' · '+fcfa(total(p))+' · '+(p.paid?'Payé':'Non payé')+'</small>'+(other?'<small>Déjà dans le convoi '+esc(other.no)+'</small>':'')+'</span></label>'}).join('');
}
function cvSum(){
  var P=S.cvSel.map(byNo).filter(Boolean),w=0,t=0;P.forEach(function(p){w+=p.w;t+=total(p)});
  return {txt:P.length+(P.length>1?' colis choisis':' colis choisi')+' · '+kg(w),amt:fcfa(t)};
}
function refreshCvPicker(){
  var a=document.getElementById('cv-list');if(a)a.innerHTML=cvPickHtml();
  var s=cvSum(),t=document.getElementById('cv-sumtxt'),m=document.getElementById('cv-sumamt');
  if(t)t.textContent=s.txt;if(m)m.textContent=s.amt;
}
V.cvform=function(){
  var e=S.cvEdit?cvById(S.cvEdit):null,s=cvSum();
  return '<form id="f-convoy" class="list"><h2 style="font-size:22px">'+(e?'Modifier le convoi '+esc(e.no):'Nouveau convoi')+'</h2>'+
  '<section class="card"><div class="grid2"><label class="f" for="cv-name">Nom du convoi<input id="cv-name" type="text" value="'+esc(S.cvName)+'" placeholder="Ex. Convoi du '+esc(fdate(S.cvDate||isoToday()))+'"></label>'+
  '<label class="f" for="cv-date">Date du convoi<input id="cv-date" type="date" value="'+esc(S.cvDate)+'" required></label></div></section>'+
  '<section class="card"><h2>Colis du convoi</h2><label class="f" for="cv-q">Rechercher un colis<input id="cv-q" type="text" value="'+esc(S.cvQ)+'" placeholder="Nom, téléphone, n° de colis"></label>'+
  '<div class="acts"><button type="button" class="btn ghost sm" data-cvall="1">Tout cocher</button><button type="button" class="btn ghost sm" data-cvnone="1">Tout décocher</button></div>'+
  '<div id="cv-list" class="cvpick">'+cvPickHtml()+'</div>'+
  '<div class="total"><span id="cv-sumtxt">'+esc(s.txt)+'</span><b id="cv-sumamt">'+esc(s.amt)+'</b></div></section>'+
  '<div class="acts"><button class="btn accent" type="submit">Enregistrer le convoi</button><button class="btn ghost" type="button" data-nav="convoys">Annuler</button></div></form>';
};
function openCvForm(id){
  S.cvEdit=id||null;var c=id?cvById(id):null;
  S.cvSel=c?(c.parcels||[]).slice():[];S.cvName=c?c.name:'';S.cvDate=c?c.date:isoToday();S.cvQ='';
  S.view='cvform';render();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-cvnew],[data-cvopen],[data-cvedit],[data-cvpdf],[data-cvdel],[data-cvdelc],[data-cvall],[data-cvnone]');if(!el)return;
  var d=el.dataset;
  if(d.cvnew){openCvForm(null);return}
  if(d.cvopen){S.cv=d.cvopen;S.view='convoy';render();return}
  if(d.cvedit){openCvForm(d.cvedit);return}
  if(d.cvpdf){makeConvoyPdf(d.cvpdf);return}
  if(d.cvdel){S.cvConfirm=d.cvdel;rerender();return}
  if(d.cvdelc){var id=d.cvdelc;S.cvConfirm=null;if(S.cvLocal&&S.cvLocal.id===id)S.cvLocal=null;S.db.doc('convoys/'+id).delete().then(function(){toast('Convoi supprimé')},dbErr);rerender();return}
  if(d.cvall){cvVisible().forEach(function(p){if(!cvOf(p.no,S.cvEdit)&&S.cvSel.indexOf(p.no)<0)S.cvSel.push(p.no)});refreshCvPicker();return}
  if(d.cvnone){var vis=cvVisible().map(function(p){return p.no});S.cvSel=S.cvSel.filter(function(n){return vis.indexOf(n)<0});refreshCvPicker();return}
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='cv-name')S.cvName=t.value;
  else if(t.id==='cv-date')S.cvDate=t.value;
  else if(t.id==='cv-q'){S.cvQ=t.value;refreshCvPicker()}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.cvp){var no=t.dataset.cvp,i=S.cvSel.indexOf(no);
    if(t.checked&&i<0)S.cvSel.push(no);else if(!t.checked&&i>=0)S.cvSel.splice(i,1);
    var s=cvSum(),a=document.getElementById('cv-sumtxt'),m=document.getElementById('cv-sumamt');if(a)a.textContent=s.txt;if(m)m.textContent=s.amt}
});
document.addEventListener('submit',async function(e){
  if(e.target.id!=='f-convoy')return;
  e.preventDefault();if(S.busy)return;
  var sel=S.cvSel.filter(function(n){return !!byNo(n)}).sort(function(a,b){return numOf(a)-numOf(b)});
  if(!sel.length){toast('Choisis au moins un colis');return}
  var date=S.cvDate||isoToday(),name=(S.cvName||'').trim()||('Convoi du '+fdate(date));
  var btn=e.target.querySelector('[type=submit]');S.busy=true;if(btn)btn.disabled=true;
  var doc,no;
  try{
    if(S.cvEdit){
      var old=cvById(S.cvEdit);if(!old)throw {code:'invalid_argument'};
      no=old.no;doc={no:no,name:name,date:date,parcels:sel,by:old.by||S.uid,at:old.at||Date.now()};
      await S.db.doc('convoys/'+S.cvEdit).set(doc);toast('Convoi modifié');no=S.cvEdit;
    }else{
      no=await nextCvNo();doc={no:no,name:name,date:date,parcels:sel,by:S.uid,at:Date.now()};
      await S.db.doc('convoys/'+no).set(doc);toast('Convoi enregistré');
    }
  }catch(err){dbErr(err);S.busy=false;if(btn)btn.disabled=false;return}
  S.cvLocal=Object.assign({id:no},doc);S.cv=no;
  S.busy=false;S.cvEdit=null;S.view='convoy';render();
});

/* ---------- Convoi en PDF (paysage) ---------- */
async function makeConvoyPdf(id){
  var c=cvById(id);if(!c)return;
  if(!S.dl){toast('Téléchargement indisponible dans cette vue');return}
  var J=window.jspdf;if(!J){toast('Le module PDF ne s\'est pas chargé');return}
  var L=cvParcels(c),st=cvStats(c),co=S.company,logo=co.logo?await loadImg(co.logo):null;
  var doc=new J.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.setProperties({title:'Convoi '+c.no});
  var W=297,H=210,M=12,CW=W-2*M,NAVY=[13,74,56],MUT=[86,104,96],INK=[23,38,31],OK=[20,114,74],BAD=[163,50,27];
  function T(t,x,y,o){doc.text(pdfStr(t),x,y,o)}
  function col(a){doc.setTextColor(a[0],a[1],a[2])}
  function fit(t,w){var a=doc.splitTextToSize(pdfStr(t),w);return (a[0]||'')+(a.length>1?'...':'')}
  function wm(){try{if(logo&&doc.GState){var s=Math.min(125/logo.w,125/logo.h),w=logo.w*s,h=logo.h*s;doc.saveGraphicsState();doc.setGState(new doc.GState({opacity:0.1}));doc.addImage(logo.src,'PNG',(W-w)/2,(H-h)/2+4,w,h);doc.restoreGraphicsState()}}catch(e){}}
  var cols=[{l:'N° COLIS',w:22},{l:'PAIEMENT',w:23},{l:'DATE',w:23},{l:'EXPÉDITEUR',w:66},{l:'BÉNÉFICIAIRE',w:66},{l:'POIDS',w:18,r:1},{l:'PRIX / KG',w:25,r:1},{l:'FRAIS TOTAL',w:30,r:1}];
  var xs=[],acc=M;cols.forEach(function(k){xs.push(acc);acc+=k.w});
  function tableHead(y){
    doc.setFillColor(231,240,234);doc.rect(M,y,CW,8,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);col(MUT);
    cols.forEach(function(k,i){if(k.r)T(k.l,xs[i]+k.w-2,y+5.3,{align:'right'});else T(k.l,xs[i]+2,y+5.3)});
    return y+8;
  }
  function pageHead(first){
    var y=14;
    if(!first){doc.setFont('helvetica','bold');doc.setFontSize(10);col(NAVY);T(co.name+'  ·  '+c.no+'  ·  '+c.name,M,12);doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.5);doc.line(M,16,W-M,16);return tableHead(20)}
    if(logo){var s=Math.min(24/logo.w,24/logo.h);doc.addImage(logo.src,'PNG',M,y-3,logo.w*s,logo.h*s)}
    var tx=M+(logo?30:0);
    doc.setFont('helvetica','bold');doc.setFontSize(16);col(NAVY);T(co.name,tx,y+4);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);col(MUT);
    var yy=y+10;if(co.address){T(co.address,tx,yy);yy+=5}if(co.phone){T('Tél. '+co.phone,tx,yy)}
    doc.setFont('helvetica','bold');doc.setFontSize(17);col(NAVY);T('CONVOI DE COLIS',W-M,y+4,{align:'right'});
    doc.setFont('courier','bold');doc.setFontSize(11);T(c.no,W-M,y+11,{align:'right'});
    doc.setFont('helvetica','bold');doc.setFontSize(10.5);col(INK);T(c.name,W-M,y+17,{align:'right'});
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);col(MUT);T('Date : '+fdate(c.date),W-M,y+22,{align:'right'});
    doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.7);doc.line(M,42,W-M,42);
    return tableHead(47);
  }
  wm();
  var y=pageHead(true),RH=11,LIMIT=H-20;
  function newPage(){doc.addPage();wm();y=pageHead(false)}
  L.forEach(function(p){
    if(y+RH>LIMIT)newPage();
    var okc=p.paid?OK:BAD;
    doc.setFillColor(okc[0],okc[1],okc[2]);doc.rect(M,y+1,1.4,RH-2,'F');
    doc.setFont('courier','bold');doc.setFontSize(8.5);col(NAVY);T(p.no,xs[0]+3,y+6.5);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);col(okc);T(p.paid?'Payé':'Non payé',xs[1]+2,y+6.5);
    doc.setFont('helvetica','normal');doc.setFontSize(9);col(INK);T(p.date,xs[2]+2,y+6.5);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);col(INK);T(fit(p.s.fn+' '+p.s.ln,cols[3].w-4),xs[3]+2,y+4.6);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);col(MUT);T(p.s.ph,xs[3]+2,y+9);
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);col(INK);T(fit(p.r.fn+' '+p.r.ln,cols[4].w-4),xs[4]+2,y+4.6);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);col(MUT);T(p.r.ph,xs[4]+2,y+9);
    doc.setFontSize(9.5);col(INK);T(kg(p.w),xs[5]+cols[5].w-2,y+6.5,{align:'right'});T(fcfa(p.rate),xs[6]+cols[6].w-2,y+6.5,{align:'right'});
    doc.setFont('helvetica','bold');T(fcfa(total(p)),xs[7]+cols[7].w-2,y+6.5,{align:'right'});
    doc.setDrawColor(213,222,216);doc.setLineWidth(.25);doc.line(M,y+RH,W-M,y+RH);
    y+=RH;
  });
  if(!L.length){doc.setFont('helvetica','normal');doc.setFontSize(10);col(MUT);T('Aucun colis dans ce convoi.',M+2,y+8);y+=12}
  /* Totaux */
  if(y+30>LIMIT)newPage();
  y+=6;
  var boxes=[['COLIS',String(st.n),NAVY],['POIDS TOTAL',kg(st.w),NAVY],['FRAIS TOTAL',fcfa(st.t),NAVY],['DÉJÀ PAYÉ',fcfa(st.paid),OK],['RESTE À PAYER',fcfa(st.due),st.due>0?BAD:OK]];
  var bw=(CW-4*4)/5;
  boxes.forEach(function(b,i){
    var bx=M+i*(bw+4);
    doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.4);doc.roundedRect(bx,y,bw,18,2,2);
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);col(MUT);T(b[0],bx+3,y+6);
    doc.setFontSize(13);col(b[2]);T(b[1],bx+3,y+14);
  });
  if(st.missing>0){doc.setFont('helvetica','normal');doc.setFontSize(8.5);col(MUT);T(st.missing+' colis de ce convoi ont été supprimés et ne figurent plus dans la liste.',M,y+25)}
  /* Pied de page : coordonnées sur chaque page */
  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(213,222,216);doc.setLineWidth(.3);doc.line(M,H-12,W-M,H-12);
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);col(MUT);
    T(co.name+(co.address?'  ·  '+co.address:'')+(co.phone?'  ·  Tél. '+co.phone:''),M,H-7);
    T('Page '+i+' / '+n,W-M,H-7,{align:'right'});
  }
  try{await S.dl.save({filename:'Convoi-'+c.no+'.pdf',data:doc.output('arraybuffer')});toast('PDF enregistré')}
  catch(e){if(!e||e.code!=='declined')toast('Téléchargement impossible')}
}

render();
Standalone.start();
</script>
